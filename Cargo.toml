[package]
name = "kvs"
version = "0.1.0"
authors = ["João Pedro Camargo <jotapemattos.dev@gmail.com>"]
edition = "2024"
description = "A key-value store"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
failure = "0.1.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "0.11.0"
predicates = "1.0.0"
tempfile = "3.0.7"
walkdir = "2.2.7"
